<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flame SMP | Support</title>
<meta name="description" content="Flame SMP support: ban and mute appeals, reports, media applications and connection help on Discord.">
<meta name="theme-color" content="#141414">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.sup{max-width:1180px;margin:0 auto;padding:0 20px}
.sup-head{text-align:center;padding:70px 0 40px}
.sup-head h1{font-weight:900;font-size:48px;letter-spacing:-.5px}
.sup-head p{color:#ef4a2e;font-size:15.5px;font-weight:500;margin-top:8px}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.topic{--c:#cfcfcf;position:relative;display:flex;gap:16px;align-items:flex-start;min-height:140px;padding:26px 24px;border-radius:14px;background:var(--card);border:1px solid #232323;
  transition:transform .35s var(--ease),border-color .3s,background .3s,box-shadow .35s}
.topic:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 45%,#2a2a2a);background:#232323;box-shadow:0 18px 36px -16px color-mix(in srgb,var(--c) 45%,transparent)}
.topic .ic{width:26px;height:26px;flex:none;color:var(--c);margin-top:1px;transition:transform .4s var(--ease)}
.topic:hover .ic{transform:scale(1.15) rotate(-6deg)}
.topic .ic svg{width:26px;height:26px}
.topic h2{font-weight:800;font-size:18px;line-height:1.3;margin-bottom:6px;padding-right:22px}
.topic p{color:#9a9a9a;font-size:14px;line-height:1.6}
.topic .go{position:absolute;top:28px;right:22px;width:18px;height:18px;color:#8a8a8a;transition:transform .3s var(--ease),color .3s}
.topic:hover .go{transform:translateX(4px);color:#fff}
.sup-line{border:0;height:1px;background:#262626;margin:40px 0 0}
.sup-foot{display:grid;justify-items:center;gap:16px;padding:36px 0 0;text-align:center}
.sup-foot p{color:#ef4a2e;font-size:17px;font-weight:500}
.dc-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:12px;background:#5865f2;color:#fff;font-weight:800;font-size:15px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:filter .2s,transform .15s}
.dc-btn:hover{filter:brightness(1.1)}
.dc-btn:active{transform:scale(.97)}
.dc-btn svg{width:20px;height:20px}
@media (max-width:900px){ .topics{grid-template-columns:1fr 1fr} }
@media (max-width:580px){
  .topics{grid-template-columns:1fr}
  .sup-head{padding-top:44px}
  .sup-head h1{font-size:40px}
  .topic{min-height:0}
}
</style>
</head>
<body>
<div class="pattern" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-in">
    <a href="index.html" class="tb-brand"><img src="img/logo.png" alt=""><span>Flame SMP</span></a>
    <nav class="tb-nav" aria-label="Main">
      <a href="index.html" data-i18n="home">Home</a>
      <a href="store.html" data-i18n="store">Store</a>
      <a data-link="discord" target="_blank" rel="noopener">Discord</a>
      <a href="support.html" class="active" data-i18n="support">Support</a>
    </nav>
    <div data-tools="lang"></div>
    <a class="tb-cta" href="store.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6"/></svg><span data-i18n="store">Store</span></a>
  </div>
</header>

<main class="sup">
  <div class="sup-head rise">
    <h1 data-i18n="support">Support</h1>
    <p data-i18n="supSub">Pick a topic. Use Discord so replies reach you, and you get your problem fixed.</p>
  </div>

  <div class="topics" id="topics"></div>

  <hr class="sup-line">
  <div class="sup-foot rise" style="--d:500ms">
    <p data-i18n="useDc">Use Discord to get our helpful support!</p>
    <a class="dc-btn" data-link="discord" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 5.2A17.6 17.6 0 0 0 15.2 3.8l-.6 1.2a16 16 0 0 0-5.2 0l-.6-1.2a17.6 17.6 0 0 0-4.4 1.4C1.6 9.4.8 13.5 1.2 17.5a17.8 17.8 0 0 0 5.4 2.7l1.1-1.8a11.4 11.4 0 0 1-1.8-.9l.4-.3a12.6 12.6 0 0 0 11.4 0l.4.3a11.4 11.4 0 0 1-1.8.9l1.1 1.8a17.8 17.8 0 0 0 5.4-2.7c.5-4.7-.8-8.7-3.2-12.3zM8.5 15.1c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2z"/></svg>
      <span data-i18n="openDc">Open Discord</span>
    </a>
  </div>

  <footer id="footer"></footer>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
const TOPICS = [
  { t:'Ban Appeal', d:'Appeal an active ban on your account.', c:'#ef4444',
    i:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>' },
  { t:'Mute Appeal', d:'Appeal an active mute on your account.', c:'#cfcfcf',
    i:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>' },
  { t:'Media', d:'Apply for content creator perks after meeting the requirements.', c:'#fbbf24',
    i:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/>' },
  { t:'Player Report', d:'Report another player for breaking the rules.', c:'#fbbf24',
    i:'<path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/>' },
  { t:'Bug Report', d:'Report a bug or issue you ran into on the server.', c:'#cfcfcf',
    i:'<rect x="7" y="7" width="10" height="13" rx="5"/><path d="M12 7v13M3 13h4M17 13h4M4 7l3 2M20 7l-3 2M4 20l3-2M20 20l-3-2M9 4l1.5 2M15 4l-1.5 2"/>' },
  { t:'Connection Issues', d:'Get help connecting to the server.', c:'#cfcfcf',
    i:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>' }
];
// every topic opens the Discord server
$('topics').innerHTML = TOPICS.map((x,i) => `
  <a class="topic rise" style="--c:${x.c};--d:${100 + i*70}ms" href="${CONFIG.links.discord}" target="_blank" rel="noopener">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${x.i}</svg></span>
    <div><h2>${t('t' + (i + 1))}</h2><p>${t('d' + (i + 1))}</p></div>
    <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </a>`).join('');
</script>
</body>
</html>
