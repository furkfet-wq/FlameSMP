<style>

/* ===== page ===== */
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.store-head{text-align:center;padding:52px 16px 0}
.store-head h1{font-weight:900;font-size:46px;letter-spacing:-.5px}
.store-head p{color:var(--muted);font-size:15px;margin-top:8px}
.sec-label{text-align:center;font-size:12px;font-weight:700;letter-spacing:3px;color:#8d8d8d;margin:50px 0 24px;text-transform:uppercase}

/* ===== winter sale: 45 degree ribbon fixed in the top-left corner, over the top bar; click copies the code ===== */
.store-main{position:relative}
.sale{position:fixed;top:0;left:0;width:250px;height:250px;overflow:hidden;z-index:60;pointer-events:none;transform-origin:0 0;transform:scale(1.35);transition:opacity .2s}
/* get out of the way of an open language / currency menu */
body:has(.pick.open) .sale{opacity:0;visibility:hidden}
/* the top bar's buttons start to the right of the ribbon, so nothing is covered (wide screens already have the room) */
body:has(.sale) .topbar-in{padding-left:max(16px,calc(280px - max(0px,(100vw - 900px) / 2)))}
.sale-band{position:absolute;left:-83px;top:19px;width:300px;height:96px;transform:rotate(-45deg);pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;border:0;font-family:Montserrat,sans-serif;color:#06223f;
  background:radial-gradient(circle,#fff 1.4px,transparent 2px) 0 0/34px 34px,radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.6px) 11px 17px/23px 23px,linear-gradient(180deg,#e8f8ff,#8fd6ff 55%,#4aa8f0);
  box-shadow:0 8px 26px rgba(60,170,255,.45),inset 0 0 0 3px rgba(255,255,255,.35);animation:snow 6s linear infinite;transition:filter .2s}
.sale-band:hover{filter:brightness(1.08)}
.sale-band::after{content:"";position:absolute;top:0;bottom:0;width:50px;left:-70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:wshine 4s ease-in-out infinite;pointer-events:none}
.sale-name{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;max-width:128px;line-height:1.15}
.sale-name span{overflow:hidden;text-overflow:ellipsis}
.sale-name i{width:4px;height:4px;flex:none;background:currentColor;transform:rotate(45deg)}
.sale-band b{font-size:21px;font-weight:900;line-height:1.05;letter-spacing:-.3px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.sale-code{display:flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;border:1.5px dashed rgba(255,255,255,.75);background:#0b3560;color:#fff;font-size:12px;font-weight:800;letter-spacing:1.5px}
.sale-code svg{width:11px;height:11px}
.sale-time{font-size:11px;font-weight:800;letter-spacing:.8px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes snow{to{background-position:0 34px,11px 63px,0 0}}
@keyframes wshine{0%,55%{left:-70px}100%{left:340px}}
body:has(.sale) .tb-cta{min-width:0;overflow:hidden}
@media (max-width:1460px){body:has(.sale) .tb-brand span{display:none}}
@media (max-width:1240px){
  .sale{transform:scale(1.05)}
  body:has(.sale) .topbar-in{gap:10px;padding-left:max(16px,calc(216px - max(0px,(100vw - 900px) / 2)))}
}
@media (max-width:960px){
  /* small screens: two rows (pickers on top, the rest below) beside the ribbon */
  body:has(.sale) .topbar-in{height:auto;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:9px 12px 9px 216px}
  body:has(.sale) .topbar .tools{order:-1;width:100%;justify-content:flex-end;margin:0}
}
@media (max-width:820px){
  .sale{transform:scale(.82)}
  body:has(.sale) .topbar-in{padding-left:166px}
  body:has(.sale) .topbar .tools + .tb-cta{margin:0;max-width:calc(100% - 34px);padding:8px 10px;gap:6px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.sale-band,.sale-band::after{animation:none}}

/* ===== rank banners ===== */
.rank{--ink:#2a1406;position:relative;display:grid;grid-template-columns:190px 1fr 140px;gap:22px;align-items:center;margin-bottom:26px;padding:22px 24px;border-radius:20px;
  background:var(--grad);color:var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.rank:hover{transform:translateY(-3px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 20px 44px -16px var(--glow)}
.rank .tag{position:absolute;top:-11px;left:24px;padding:4px 11px;border-radius:999px;background:#141414;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:1px}
.rname{display:flex;align-items:center;gap:9px;font-weight:900;font-size:26px;line-height:1.1}
.rname img{width:30px;height:30px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rprice{font-weight:700;font-size:14px;margin-top:6px;opacity:.9}
.rnote{font-weight:600;font-size:13px;opacity:.75}
.ractions{display:flex;gap:8px;margin-top:16px}
.rbuy{padding:11px 20px;border-radius:10px;background:#141414;color:#fff;font-weight:800;font-size:14px;transition:transform .15s,background .2s}
.rbuy:hover{background:#000}
.rbuy:active{transform:scale(.96)}
.perks{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px 22px;font-weight:700;font-size:13.5px;line-height:1.3}
.perks li{display:flex;align-items:center;gap:10px}
.perks .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;opacity:.85}
.perks .ic svg{width:18px;height:18px}
.perks .ic img{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.rart{position:relative;align-self:stretch;display:grid;place-items:center}
.rart svg{width:118px;height:138px;overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35)) drop-shadow(0 0 0 transparent);
  transition:filter .5s;animation:float 6s ease-in-out infinite;animation-delay:var(--fd,0s)}
.rank.big .rart svg{width:142px;height:166px} /* Flame+++ badge: 20% bigger */
.rank:hover .rart svg{filter:drop-shadow(0 12px 14px rgba(0,0,0,.35)) drop-shadow(0 0 14px color-mix(in srgb,var(--cg) 75%,transparent))}
.rart .crest{transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.rank:hover .rart .crest{transform:translateY(-4px) scale(1.06)}
.rank:hover .rart .emb{animation:flick 1.2s ease-in-out infinite}
.rank:hover .rart .emb.crown{animation:bob 1.6s ease-in-out infinite}
.rank:hover .rart .glint{animation:glint 1.1s var(--ease) .12s both}
.rank:hover .rart .pip{animation:pip .5s ease-out calc(.2s + var(--k) * .13s) both}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.96,1.08)}65%{transform:scale(1.03,.96)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes glint{from{transform:translateX(0)}to{transform:translateX(240px)}}
@keyframes pip{45%{transform:scale(1.7)}}
/* bundles: red % off tag in the top-left corner; crate art: on hover the lid pops open, light shines out, sparkles rise */
.off-tag{position:absolute;top:-13px;left:-10px;z-index:2;padding:6px 13px;border-radius:999px;background:linear-gradient(135deg,#ff4d4d,#d90f2f);color:#fff;
  font-weight:900;font-size:12.5px;letter-spacing:1px;white-space:nowrap;transform:rotate(-8deg);box-shadow:0 6px 18px rgba(220,20,50,.5),inset 0 -2px 0 rgba(0,0,0,.18);animation:offpop 2.6s ease-in-out infinite}
@keyframes offpop{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-8deg) scale(1.07)}}
/* bundle contents: one tile per item, real item pictures; they pop one after another when the crate opens */
.loot{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-right:16px}
.loot li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 2px 10px;border-radius:14px;text-align:center;
  background:rgba(255,255,255,.5);transition:transform .5s cubic-bezier(.34,1.56,.64,1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.08)}
.loot img{width:48px;height:48px;object-fit:contain;margin-bottom:4px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));animation:lootbob 2.4s ease-in-out calc(var(--k) * -.45s) infinite}
@keyframes lootbob{50%{transform:translateY(-4px)}}
.loot b{font-weight:900;font-size:16px;line-height:1.1}
.loot span{font-weight:700;font-size:11px;line-height:1.2;opacity:.8;white-space:nowrap}
.rank:hover .loot li{transform:translateY(-4px);transition-delay:calc(.15s + var(--k) * .07s)}
.rart .lid{transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.rart .beam,.rart .spk{opacity:0;transition:opacity .4s}
.rank:hover .rart .lid{transform:translate(-4px,-12px) rotate(-14deg)}
.rank:hover .rart .beam{opacity:1;animation:beam 1.8s ease-in-out .3s infinite}
.rank:hover .rart .spk{animation:sparkrise 1.8s ease-out calc(.3s + var(--k) * .3s) infinite}
.rank:hover .rart .crate{animation:hop .5s ease-out}
@keyframes beam{50%{opacity:.6}}
@keyframes sparkrise{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes hop{40%{transform:scale(1.05,.94)}70%{transform:scale(.97,1.04)}}
@media (prefers-reduced-motion:reduce){.loot img{animation:none}.loot li{transition:none}.off-tag,.rank:hover .rart .beam,.rank:hover .rart .spk,.rank:hover .rart .crate{animation:none}.rart .lid{transition:none}}

/* ===== best value: animated ring, shine and a bigger badge ===== */
.feat{position:relative;margin:44px 0 34px;border-radius:24px;isolation:isolate;transition:transform .4s var(--ease)}
.feat:hover{transform:translateY(-3px)}
.feat::before,.feat::after{content:"";position:absolute;inset:-3px;border-radius:24px;z-index:-1;
  background:conic-gradient(from var(--ang),#ffd36b,#ff5f38,#dc2458,#ff9a3c,#ffd36b);animation:ring 5s linear infinite}
.feat::after{inset:-10px;filter:blur(22px);opacity:.55;animation:ring 5s linear infinite,breathe 4s ease-in-out infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ring{to{--ang:360deg}}
.feat.still::before,.feat.still::after,.feat.still .shine::before,.feat.still .best-badge{animation-play-state:paused}
@keyframes breathe{50%{opacity:.85}}
.feat .rank{margin:0;padding-top:28px;padding-bottom:26px;transform:none}
.feat .rank:hover{transform:none}
.feat .rname{font-size:30px}
.feat .rart svg{width:136px;height:158px}
.shine{position:absolute;inset:0;border-radius:20px;overflow:hidden;pointer-events:none}
.shine::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.best-badge{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:999px;
  background:linear-gradient(135deg,#ffe08a,#ffb53c);color:#2a1200;font-weight:900;font-size:12.5px;letter-spacing:1.5px;white-space:nowrap;
  box-shadow:0 6px 20px rgba(255,170,40,.55),inset 0 -2px 0 rgba(0,0,0,.15);animation:pop 2.6s ease-in-out infinite}
.best-badge svg{width:14px;height:14px}
@keyframes pop{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
.save-chip{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:800}
.feat .rbuy{background:#fff;color:#c4163f}
.feat .rbuy:hover{background:#ffe9ef}

/* ===== item cards (shards + keys) ===== */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{--c:#fff;--ink:#140a00;position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 16px 16px;text-align:center;
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 45%,#2a2a2a)}
.card.pop{border-color:color-mix(in srgb,var(--c) 75%,transparent);box-shadow:0 0 34px -10px color-mix(in srgb,var(--c) 60%,transparent)}
.badge,.best-badge{text-transform:uppercase}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:4px 11px;border-radius:999px;background:var(--c);color:var(--ink);font-size:10.5px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.card .art{width:124px;height:124px;margin:0 auto 6px;transition:transform .6s var(--ease)}
.card:hover .art{transform:rotate(-6deg) scale(1.08)}
.card .art img{width:100%;height:100%;object-fit:contain;animation:float 6s ease-in-out infinite;animation-delay:var(--fd,0s)}
.card .nm{color:var(--c);font-weight:800;font-size:17px}
.card .pr{font-weight:900;font-size:25px;margin-top:8px}
.card .per{font-size:12px;color:#8a8a8a;margin-top:2px}
.chip{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(74,222,128,.12);color:#4ade80}
.chip.none{background:#262626;color:#8a8a8a}
.cbuy{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:11px;border-radius:10px;background:var(--c);color:var(--ink);font-weight:800;font-size:14.5px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:filter .2s,transform .15s}
.cbuy:hover{filter:brightness(1.1)}
.cbuy:active{transform:scale(.97)}
.cbuy svg{width:17px;height:17px}

/* ===== identify yourself ===== */
.identify{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#1d0f0a 0%,#0b0b0b 62%);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.identify.open{opacity:1;visibility:visible}
.id-close{position:absolute;top:18px;right:18px}
.identify>div{width:100%;max-width:640px;min-width:0}
.id-kick{font-size:13px;font-weight:600;letter-spacing:7px;color:#7a7a7a;text-transform:uppercase}
.id-title{font-weight:900;font-size:clamp(52px,11vw,128px);line-height:.9;letter-spacing:-1.5px;margin:22px 0 36px}
.id-title span{display:block}
.id-title .l1{color:#ededed}
.id-title .l2{color:var(--accent-2)}
.id-form{width:min(460px,100%);margin:0 auto;text-align:left}
.id-ed{display:flex;gap:10px}
.id-label2{margin-top:18px}
.id-ed button{flex:1;padding:12px;border-radius:12px;background:#262626;border:2px solid #4a4a4a;color:#a8a8a8;font:800 15px Montserrat,sans-serif;letter-spacing:.5px;cursor:pointer;transition:border-color .2s,color .2s,background .2s,box-shadow .2s,transform .15s}
.id-ed button:hover{border-color:#6a6a6a;color:#e5e5e5}
.id-ed button:active{transform:scale(.97)}
.id-ed button.on{border-color:var(--accent);background:#2a2a2a;color:#fff;box-shadow:0 0 0 4px rgba(255,122,31,.18)}
.id-label{display:block;font-size:13px;font-weight:800;letter-spacing:1px;color:#d0d0d0;text-transform:uppercase;margin-bottom:8px}
.id-field{display:flex;align-items:center;gap:12px;height:60px;padding:0 14px 0 10px;background:#262626;border:2px solid #4a4a4a;border-radius:14px;cursor:text;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .2s,background .2s}
.id-field:hover{border-color:#6a6a6a}
.id-field:focus-within{border-color:var(--accent);background:#2a2a2a;box-shadow:0 0 0 4px rgba(255,122,31,.22),inset 0 2px 6px rgba(0,0,0,.35)}
.id-field img{width:40px;height:40px;border-radius:8px;flex:none;image-rendering:pixelated;background:#333}
.id-field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;color:#fff;font:700 18px Montserrat,sans-serif;caret-color:var(--accent)}
.id-field input::placeholder{color:#8a8a8a;font-weight:600}
.id-field .pen{width:20px;height:20px;flex:none;color:#8a8a8a}
.id-field:focus-within .pen{color:var(--accent)}
.id-go{width:100%;margin-top:12px;padding:15px;border-radius:12px;background:var(--accent);color:#1d0b00;font-weight:900;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:filter .2s,transform .15s}
.id-go:hover{filter:brightness(1.08)}
.id-go:active{transform:scale(.98)}
.id-form.bad .id-field{border-color:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.2);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.id-note{margin-top:14px;font-size:13px;color:#7a7a7a}

/* ===== checkout ===== */
.co .mbox{width:min(540px,100%)}
.co .mhead{padding:24px 26px}
.co .mhead .ic{width:64px;height:64px;border-radius:14px;background:#262626}
.co .mhead .mtitle{font-size:23px}
.co .kick{font-size:12.5px}
.co .mbody{padding:24px 26px 26px}
.playing{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:14px;background:#171717;border:1px solid #2a2a2a;margin-bottom:18px}
.playing img{width:46px;height:46px;border-radius:8px;image-rendering:pixelated}
.playing small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#7a7a7a;text-transform:uppercase}
.playing b{font-size:17px;color:#fff}
.playing button{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--accent)}
.playing button:hover{text-decoration:underline}
.pay{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border-radius:14px;font-weight:800;font-size:16.5px;margin-bottom:12px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:filter .2s,transform .15s}
.pay:hover{filter:brightness(1.08)}
.pay:active{transform:scale(.98)}
.pay svg{width:19px;height:19px}
.pay small{font-weight:600;opacity:.75;font-size:12px}
.pay-stripe{background:#635bff;color:#fff}
.co-note{font-size:13.5px;color:#8a8a8a;line-height:1.6;margin-top:6px}

@media (max-width:820px){
  .rank{grid-template-columns:1fr;gap:16px;padding-right:130px}
  .rart{position:absolute;right:14px;top:14px;width:100px;height:116px}
  .rart svg,.feat .rart svg{width:100px;height:116px}
  .rank.big{padding-right:154px}
  .rank.big .rart{width:120px;height:139px}
  .rank.big .rart svg{width:120px;height:139px}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){
  .store-head h1{font-size:38px}
  .rank{padding-right:24px}
  .rart{width:70px;height:82px;top:16px;right:12px}
  .rart svg,.feat .rart svg{width:70px;height:82px}
  .rank.big{padding-right:24px}
  .rank.big .rname{padding-right:86px} /* keep the name clear of the bigger badge */
  .rank.big .rart{width:84px;height:98px}
  .rank.big .rart svg{width:84px;height:98px}
  .perks{grid-template-columns:1fr}
  .loot{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-right:0}
  .loot li{width:calc((100% - 24px) / 3)}
  .cards{gap:14px}
